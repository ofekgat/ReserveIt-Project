<ui:composition template="/WEB-INF/template.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <ui:define name="title">Log in - GetTicket</ui:define>
    <ui:define name="content">
        <p class="hint">Demo login: <strong>demo</strong> / <strong>demo123</strong> &#8212; or register a new account below (kept in memory only).</p>
        <div class="auth-columns">
            <h:form styleClass="card">
                <h2>Log in</h2>
                <h:panelGrid columns="2">
                    <h:outputLabel for="uname" value="Username" />
                    <h:inputText id="uname" value="#{userSessionBean.uname}" required="true" />

                    <h:outputLabel for="password" value="Password" />
                    <h:inputSecret id="password" value="#{userSessionBean.password}" required="true" />
                </h:panelGrid>
                <h:commandButton value="Log in" action="#{userSessionBean.login}" />
            </h:form>

            <h:form styleClass="card">
                <h2>Register</h2>
                <h:panelGrid columns="2">
                    <h:outputLabel for="runame" value="Username" />
                    <h:inputText id="runame" value="#{userSessionBean.uname}" required="true" />

                    <h:outputLabel for="rpassword" value="Password" />
                    <h:inputSecret id="rpassword" value="#{userSessionBean.password}" required="true" />

                    <h:outputLabel for="remail" value="Email" />
                    <h:inputText id="remail" value="#{userSessionBean.email}" required="true" />
                </h:panelGrid>
                <h:commandButton value="Register" action="#{userSessionBean.register}" />
            </h:form>
        </div>
    </ui:define>
</ui:composition>
