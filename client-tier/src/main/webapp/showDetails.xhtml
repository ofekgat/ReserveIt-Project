<ui:composition template="/WEB-INF/template.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <ui:define name="title">#{catalogBean.selectedShow.sname} - GetTicket</ui:define>
    <ui:define name="content">
        <f:metadata>
            <f:viewParam name="sid" value="#{catalogBean.sid}" required="true" />
            <f:viewAction action="#{catalogBean.loadShowDetails}" />
        </f:metadata>

        <h:panelGroup rendered="#{not empty catalogBean.selectedShow}">
            <h2>#{catalogBean.selectedShow.sname}</h2>
            <p class="category">#{catalogBean.selectedShow.category}</p>
            <p>#{catalogBean.selectedShow.description}</p>
            <p class="rating-summary">
                <h:outputText value="#{catalogBean.averageRating}" rendered="#{catalogBean.averageRating gt 0}">
                    <f:convertNumber pattern="0.0" />
                </h:outputText>
                <h:outputText value=" / 5 average" rendered="#{catalogBean.averageRating gt 0}" />
                <h:outputText value="No reviews yet" rendered="#{catalogBean.averageRating eq 0}" />
                &#160;&#8211;&#160;
                <h:link outcome="/reviews" value="See reviews">
                    <f:param name="sid" value="#{catalogBean.sid}" />
                </h:link>
            </p>

            <h3>Showtimes</h3>
            <h:panelGroup rendered="#{empty catalogBean.instancesForSelectedShow}">
                <p>No scheduled showtimes yet.</p>
            </h:panelGroup>
            <ul class="instance-list">
                <ui:repeat value="#{catalogBean.instancesForSelectedShow}" var="instance">
                    <li>
                        <span>
                            <h:outputText value="#{instance.startTime}">
                                <f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm" />
                            </h:outputText>
                            &#160;&#8211;&#160;#{catalogBean.venueNameFor(instance.vid)}
                            &#160;&#8211;&#160;<h:outputText value="#{instance.ticketPrice}">
                                <f:convertNumber type="currency" currencySymbol="$" />
                            </h:outputText>
                            &#160;(#{instance.availableTickets} left)
                        </span>
                        <h:form>
                            <h:commandButton value="Book"
                                              action="#{checkoutBean.selectInstance(instance.instanceId)}"
                                              disabled="#{instance.availableTickets le 0}" />
                        </h:form>
                    </li>
                </ui:repeat>
            </ul>
        </h:panelGroup>
    </ui:define>
</ui:composition>
