<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title><ui:insert name="title">GetTicket</ui:insert></title>
    <h:outputStylesheet library="css" name="style.css" />
</h:head>
<h:body>
    <div class="topbar">
        <h:link outcome="/catalog" value="GetTicket" styleClass="brand" />
        <div class="nav-right">
            <h:panelGroup rendered="#{userSessionBean.loggedIn}">
                <h:link outcome="/myBookings" value="My Tickets" />
                <span>Hi, #{userSessionBean.currentUser.uname}</span>
                <h:form>
                    <h:commandLink value="Log out" action="#{userSessionBean.logout}" />
                </h:form>
            </h:panelGroup>
            <h:panelGroup rendered="#{!userSessionBean.loggedIn}">
                <h:link outcome="/login" value="Log in" />
            </h:panelGroup>
        </div>
    </div>
    <h:messages globalOnly="false" layout="list" styleClass="messages" />
    <div class="content">
        <ui:insert name="content" />
    </div>
</h:body>
</html>
