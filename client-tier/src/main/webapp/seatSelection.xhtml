<ui:composition template="/WEB-INF/template.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <ui:define name="title">Select seats - GetTicket</ui:define>
    <ui:define name="content">
        <h:panelGroup rendered="#{empty checkoutBean.eventInstance}">
            <p>No showtime selected. Please pick one from a show's page.</p>
        </h:panelGroup>

        <h:panelGroup rendered="#{not empty checkoutBean.eventInstance}">
            <h2>#{checkoutBean.venue.vname}</h2>
            <p>Price per ticket:
                <h:outputText value="#{checkoutBean.eventInstance.ticketPrice}">
                    <f:convertNumber type="currency" currencySymbol="₪" />
                </h:outputText>
            </p>

            <h:form rendered="#{checkoutBean.numberedVenue}">
                <div class="seat-legend">
                    <span><i class="legend-seat available"></i>Available</span>
                    <span><i class="legend-seat selected"></i>Selected</span>
                    <span><i class="legend-seat occupied"></i>Taken</span>
                </div>

                <div class="seat-map">
                    <ui:repeat value="#{checkoutBean.seatRows}" var="seatRow">
                        <div class="seat-row">
                            <span class="row-label">#{seatRow.rowNum}</span>
                            <ui:repeat value="#{seatRow.seats}" var="seat">
                                <h:commandButton value="#{seat.seatNum}"
                                                  title="Row #{seat.rowNum}, seat #{seat.seatNum}#{checkoutBean.isSeatTaken(seat.seatId) ? ' — already taken' : ''}"
                                                  disabled="#{checkoutBean.isSeatTaken(seat.seatId)}"
                                                  styleClass="seat #{checkoutBean.isSeatTaken(seat.seatId) ? 'occupied' : (checkoutBean.isSeatSelected(seat.seatId) ? 'selected' : '')}"
                                                  action="#{checkoutBean.toggleSeat(seat.seatId)}" />
                            </ui:repeat>
                            <span class="row-label">#{seatRow.rowNum}</span>
                        </div>
                    </ui:repeat>
                </div>

                <h:panelGroup rendered="#{empty checkoutBean.seatRows}">
                    <p>This venue has no seat map yet. Ask an administrator to set up its seating.</p>
                </h:panelGroup>
            </h:form>

            <h:form rendered="#{!checkoutBean.numberedVenue}">
                <h:outputLabel for="qty" value="Number of tickets" />
                <h:inputText id="qty" value="#{checkoutBean.ticketQuantity}" size="3" />
                <h:commandButton value="Update total" />
            </h:form>

            <p class="total-price">Total:
                <h:outputText value="#{checkoutBean.totalPrice}">
                    <f:convertNumber type="currency" currencySymbol="₪" />
                </h:outputText>
            </p>

            <h:form>
                <h:commandButton value="Confirm booking" action="#{checkoutBean.checkout}" />
            </h:form>
        </h:panelGroup>
    </ui:define>
</ui:composition>
