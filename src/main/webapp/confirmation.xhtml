<ui:composition template="/WEB-INF/template.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <ui:define name="title">Booking confirmed - GetTicket</ui:define>
    <ui:define name="content">
        <h:panelGroup rendered="#{not empty checkoutBean.lastBooking}">
            <h2>Booking confirmed!</h2>
            <p>Booking #<h:outputText value="#{checkoutBean.lastBooking.bookingId}" /></p>
            <p>Status: #{checkoutBean.lastBooking.status}</p>
            <p>Total paid:
                <h:outputText value="#{checkoutBean.lastBooking.totalPrice}">
                    <f:convertNumber type="currency" currencySymbol="$" />
                </h:outputText>
            </p>
        </h:panelGroup>
        <h:panelGroup rendered="#{empty checkoutBean.lastBooking}">
            <p>No recent booking found.</p>
        </h:panelGroup>
        <h:link outcome="/catalog" value="Back to shows" />
    </ui:define>
</ui:composition>
