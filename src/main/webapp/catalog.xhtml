<ui:composition template="/WEB-INF/template.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <ui:define name="title">Shows - GetTicket</ui:define>
    <ui:define name="content">
        <f:metadata>
            <f:viewAction action="#{catalogBean.loadAllShows}" />
        </f:metadata>

        <h:form styleClass="search-bar">
            <h:inputText value="#{catalogBean.nameFilter}" title="Show name" />
            <h:commandButton value="Search by name" action="#{catalogBean.searchByName}" />

            <h:inputText value="#{catalogBean.categoryFilter}" title="Category" />
            <h:commandButton value="Filter by category" action="#{catalogBean.searchByCategory}" />

            <h:inputText value="#{catalogBean.dateFilterText}" title="yyyy-mm-dd" />
            <h:commandButton value="Filter by date" action="#{catalogBean.searchByDate}" />

            <h:commandButton value="Show all" action="#{catalogBean.loadAllShows}" />
        </h:form>

        <h:panelGroup rendered="#{empty catalogBean.shows}">
            <p>No shows match your search.</p>
        </h:panelGroup>

        <div class="show-grid">
            <ui:repeat value="#{catalogBean.shows}" var="show">
                <div class="show-card">
                    <h:graphicImage url="#{show.imageUrl}" rendered="#{not empty show.imageUrl}" />
                    <h3>#{show.sname}</h3>
                    <p class="category">#{show.category}</p>
                    <p>#{show.description}</p>
                    <h:link outcome="/showDetails" value="View showtimes">
                        <f:param name="sid" value="#{show.sid}" />
                    </h:link>
                </div>
            </ui:repeat>
        </div>
    </ui:define>
</ui:composition>
